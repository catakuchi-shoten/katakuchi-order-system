# 毎日、Supabase のデータ(受注・取引先など)をまるごと書き出して、Xserver の _backup フォルダに保存する。
# _backup フォルダには .htaccess で「外からは一切開けない」設定を置き、保存のたびに開けないことを確かめる。
# 必要な Secrets: SUPABASE_DB_URL(Supabase の Session pooler の接続文字列。パスワード入り)/ FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
# このリポジトリは公開なので、バックアップの中身はログにも Artifacts にも出さない。
name: Backup to Xserver

on:
  schedule:
    - cron: '0 18 * * *'   # 毎日 3:00(日本時間)
  workflow_dispatch:

concurrency:
  group: backup-xserver
  cancel-in-progress: false

env:
  BACKUP_DIR: _backup
  KEEP_DAYS: 60
  SITE_URL: https://order.catakuchi6.co.jp

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump(PostgreSQL 17 用)を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client-17 >/dev/null
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: データを書き出す
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          name="katakuchi-$(TZ=Asia/Tokyo date +%Y-%m-%d).sql.gz"
          echo "BACKUP_NAME=$name" >> "$GITHUB_ENV"
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public --no-owner --no-privileges \
            | gzip -9 > "$RUNNER_TEMP/$name"
          size=$(stat -c %s "$RUNNER_TEMP/$name")
          echo "サイズ: $size バイト"
          # 中身が空に近いときは失敗にする(接続はできたがデータが取れていない等)。
          [ "$size" -gt 10000 ] || { echo "バックアップが小さすぎます"; exit 1; }

      - name: Xserver に保存する
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          ftp="ftp://$FTP_SERVER/$BACKUP_DIR"
          auth="$FTP_USERNAME:$FTP_PASSWORD"
          # 外から開けない設定を毎回置き直す(消えていても戻るように)。
          printf 'Require all denied\n' > "$RUNNER_TEMP/htaccess"
          curl -sS --ssl-reqd --ftp-create-dirs --user "$auth" -T "$RUNNER_TEMP/htaccess" "$ftp/.htaccess"
          curl -sS --ssl-reqd --user "$auth" -T "$RUNNER_TEMP/$BACKUP_NAME" "$ftp/$BACKUP_NAME"
          echo "保存しました: $BACKUP_DIR/$BACKUP_NAME"

          # KEEP_DAYS 日より古いバックアップを消す。
          limit=$(TZ=Asia/Tokyo date -d "-$KEEP_DAYS days" +%Y-%m-%d)
          curl -sS --ssl-reqd --user "$auth" -l "$ftp/" | tr -d '\r' \
            | grep -E '^katakuchi-[0-9]{4}-[0-9]{2}-[0-9]{2}\.sql\.gz$' \
            | while read -r f; do
                d=${f#katakuchi-}; d=${d%.sql.gz}
                if [[ "$d" < "$limit" ]]; then
                  curl -sS --ssl-reqd --user "$auth" "$ftp/" -Q "DELE $BACKUP_DIR/$f" -o /dev/null && echo "古いものを削除: $f"
                fi
              done

      - name: 外から開けないことを確かめる
        run: |
          for path in "$BACKUP_DIR/$BACKUP_NAME" "$BACKUP_DIR/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/$path")
            echo "$path → $code"
            if [ "$code" != "403" ] && [ "$code" != "404" ]; then
              echo "::error::バックアップが外から見える可能性があります($code)"
              exit 1
            fi
          done
