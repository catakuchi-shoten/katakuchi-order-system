# main に push されたら、受注システムの画面ファイルを Xserver(order.catakuchi6.co.jp)へFTPSでアップロードする。
# 必要な Secrets(リポジトリの Settings > Secrets and variables > Actions): FTP_SERVER / FTP_USERNAME / FTP_PASSWORD
# FTP_SERVER_DIR(同じ画面の Variables、任意): アップロード先のフォルダ。FTPアカウントの最初のフォルダからの相対パス(例: public_html/)。
# 手動実行で list_only を true にすると、アップロードせずにFTPのフォルダ一覧だけを表示する(置き場所の確認用)。
name: Deploy to Xserver

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      list_only:
        description: 'アップロードせず、FTPのフォルダ一覧だけを表示する'
        type: boolean
        default: false

concurrency:
  group: deploy-xserver
  cancel-in-progress: false

jobs:
  deploy:
    # 置き場所(FTP_SERVER_DIR)を決めるまでは、push では動かさない(手動実行だけ)。
    if: ${{ github.event_name == 'workflow_dispatch' || vars.FTP_SERVER_DIR != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: FTPのフォルダ一覧を表示
        if: ${{ inputs.list_only }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "--- / ---"
          curl -sS --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/"
          echo "--- /public_html/ ---"
          curl -sS --ssl-reqd --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/public_html/" || true

      - uses: actions/checkout@v4
        if: ${{ !inputs.list_only }}

      - name: アップロードするファイルをまとめる
        if: ${{ !inputs.list_only }}
        run: |
          mkdir -p _site
          cp index.html app.js storage.js _site/
          cp -r icons _site/
          cp deploy/.htaccess _site/.htaccess

      - name: Xserver へアップロード
        if: ${{ !inputs.list_only }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_site/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
